<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>楼宇逻辑解谜 - 全平铺版</title>
    <style>
        :root { --primary: #6c5ce7; --bg: #f8f9fd; --success: #00b894; --error: #ff7675; }
        body { 
            font-family: 'PingFang SC', system-ui; background: var(--bg); 
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        /* 右上角控制面板 */
        .side-panel {
            position: fixed; top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 8px;
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 2000;
        }
        #sizeInput { width: 45px; border: 1px solid #ddd; padding: 4px; text-align: center; }
        button { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8em; }
        .btn-mode { border: 2px solid var(--primary); background: white; color: var(--primary); }
        .btn-mode.active { background: var(--primary); color: white; }
        .btn-action { background: #eeefff; color: var(--primary); }

        /* 布局容器 */
        .main-content { padding: 150px; } /* 留出足够的平铺空间 */
        .puzzle-wrapper { display: inline-grid; gap: 8px; position: relative; padding: 10px; background: #f1f2f6; border-radius: 12px; }
        
        .item-container { position: relative; width: 45px; height: 45px; }

        .cell, .clue-main { 
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; 
            background: white; border: 1px solid #dcdde1; border-radius: 6px; font-weight: bold; font-size: 1.3em; 
        }
        .clue-main { border-radius: 50%; border: 2px solid var(--primary); color: var(--primary); font-size: 1.1em; }
        .clue-main.valid { background: var(--success); color: white; border-color: var(--success); }
        .clue-main.invalid { background: var(--error); color: white; border-color: var(--error); }

        /* 平铺选项尺 */
        .ruler {
            position: absolute; display: none; gap: 2px; z-index: 10;
        }
        .edit-mode .ruler { display: flex; }
        
        /* 针对不同位置的平铺方向 */
        .ruler-top { bottom: 110%; left: 50%; transform: translateX(-50%); flex-direction: column-reverse; }
        .ruler-bottom { top: 110%; left: 50%; transform: translateX(-50%); flex-direction: column; }
        .ruler-left { right: 110%; top: 50%; transform: translateY(-50%); flex-direction: row-reverse; }
        .ruler-right { left: 110%; top: 50%; transform: translateY(-50%); flex-direction: row; }

        .ruler-btn {
            width: 22px; height: 22px; background: #dfe6e9; border-radius: 3px;
            font-size: 10px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.1s;
        }
        .ruler-btn:hover { background: var(--primary); color: white; }
        .ruler-btn.active { background: var(--primary); color: white; }
        .ruler-btn.x { background: #fab1a0; color: #d63031; }

        /* 中间格子答题菜单 */
        .cell-picker {
            position: absolute; display: none; grid-template-columns: repeat(3, 1fr); gap: 3px;
            background: #2d3436; padding: 4px; border-radius: 6px; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;
        }
        .picker-btn { width: 24px; height: 24px; background: #555; color: white; border-radius: 3px; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .edit-mode .cell { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

<div class="side-panel">
    <div class="panel-item"><span>边长:</span><input type="number" id="sizeInput" value="6" min="3" max="6" onchange="initBoard()"></div>
    <button class="btn-mode" id="editToggle" onclick="toggleEditMode()">🛠️ 修改边值</button>
    <button class="btn-action" onclick="generatePuzzle()">随机出题</button>
    <button class="btn-action" onclick="solvePuzzle()">一键求解</button>
    <button class="btn-action" style="color:#e74c3c" onclick="resetBoard()">重置格子</button>
</div>

<div class="main-content">
    <div id="puzzleBoard" class="puzzle-wrapper"></div>
</div>

<script>
let N = 6;
let isEditMode = false;

function toggleEditMode() {
    isEditMode = !isEditMode;
    document.getElementById('editToggle').classList.toggle('active', isEditMode);
    document.getElementById('puzzleBoard').classList.toggle('edit-mode', isEditMode);
    hidePickers();
}

function initBoard() {
    N = parseInt(document.getElementById('sizeInput').value);
    const board = document.getElementById('puzzleBoard');
    board.style.gridTemplateColumns = `repeat(${N + 2}, 45px)`;
    board.innerHTML = '';

    for (let r = 0; r < N + 2; r++) {
        for (let c = 0; c < N + 2; c++) {
            const container = document.createElement('div');
            container.className = 'item-container';
            const isCorner = (r === 0 || r === N + 1) && (c === 0 || c === N + 1);
            const isClue = r === 0 || r === N + 1 || c === 0 || c === N + 1;

            if (isCorner) { board.appendChild(container); continue; }

            if (isClue) {
                const type = r === 0 ? 'top' : r === N + 1 ? 'bottom' : c === 0 ? 'left' : 'right';
                const idx = (type === 'top' || type === 'bottom') ? c - 1 : r - 1;
                const main = document.createElement('div');
                main.className = 'clue-main'; main.id = `clue-${type}-${idx}`;
                
                const ruler = document.createElement('div');
                ruler.className = `ruler ruler-${type}`;
                for (let i = 1; i <= N; i++) {
                    const btn = document.createElement('div');
                    btn.className = 'ruler-btn'; btn.innerText = i;
                    btn.onclick = () => {
                        main.innerText = i;
                        Array.from(ruler.children).forEach(b => b.classList.toggle('active', b.innerText == i));
                        validateBoard();
                    };
                    ruler.appendChild(btn);
                }
                const x = document.createElement('div');
                x.className = 'ruler-btn x'; x.innerText = '×';
                x.onclick = () => { main.innerText = ''; Array.from(ruler.children).forEach(b => b.classList.remove('active')); validateBoard(); };
                ruler.appendChild(x);

                container.appendChild(main);
                container.appendChild(ruler);
            } else {
                const cell = document.createElement('div');
                cell.className = 'cell'; cell.id = `cell-${r-1}-${c-1}`;
                const picker = document.createElement('div');
                picker.className = 'cell-picker';
                for(let i=1; i<=N; i++) {
                    const b = document.createElement('div'); b.className='picker-btn'; b.innerText=i;
                    b.onclick=(e)=>{ e.stopPropagation(); cell.innerText=i; hidePickers(); validateBoard(); };
                    picker.appendChild(b);
                }
                const x = document.createElement('div'); x.className='picker-btn'; x.style.background='#d63031'; x.innerText='×';
                x.onclick=(e)=>{ e.stopPropagation(); cell.innerText=''; hidePickers(); validateBoard(); };
                picker.appendChild(x);

                cell.onclick = (e) => { e.stopPropagation(); hidePickers(); picker.style.display = 'grid'; };
                container.appendChild(cell);
                container.appendChild(picker);
            }
            board.appendChild(container);
        }
    }
}

function hidePickers() { document.querySelectorAll('.cell-picker').forEach(p => p.style.display = 'none'); }
document.addEventListener('click', hidePickers);

// 后台逻辑 (验证、求解等) 保持不变
function countVisible(arr) {
    let count = 0, max = 0;
    for (let val of arr) { if (val > max) { count++; max = val; } }
    return count;
}
function getGridState() {
    let grid = [];
    for (let r = 0; r < N; r++) {
        grid[r] = [];
        for (let c = 0; c < N; c++) grid[r][c] = parseInt(document.getElementById(`cell-${r}-${c}`).innerText) || 0;
    }
    return grid;
}
function getCluesState() {
    const clues = { top:[], bottom:[], left:[], right:[] };
    for(let i=0; i<N; i++) {
        clues.top.push(parseInt(document.getElementById(`clue-top-${i}`).innerText) || 0);
        clues.bottom.push(parseInt(document.getElementById(`clue-bottom-${i}`).innerText) || 0);
        clues.left.push(parseInt(document.getElementById(`clue-left-${i}`).innerText) || 0);
        clues.right.push(parseInt(document.getElementById(`clue-right-${i}`).innerText) || 0);
    }
    return clues;
}
function validateBoard() {
    const grid = getGridState();
    const clues = getCluesState();
    document.querySelectorAll('.cell').forEach(el => el.style.color = '#2d3436');
    document.querySelectorAll('.clue-main').forEach(el => el.classList.remove('valid', 'invalid'));
    for (let i = 0; i < N; i++) {
        checkLine(grid[i], `clue-left-${i}`, clues.left[i]);
        checkLine([...grid[i]].reverse(), `clue-right-${i}`, clues.right[i]);
        let col = []; for (let r = 0; r < N; r++) col.push(grid[r][i]);
        checkLine(col, `clue-top-${i}`, clues.top[i]);
        checkLine([...col].reverse(), `clue-bottom-${i}`, clues.bottom[i]);
    }
}
function checkLine(arr, id, target) {
    if (!target) return;
    const el = document.getElementById(id);
    const vis = countVisible(arr);
    if (!arr.includes(0)) el.classList.add(vis === target ? 'valid' : 'invalid');
    else if (vis > target) el.classList.add('invalid');
}
function solvePuzzle() {
    const clues = getCluesState();
    let grid = Array.from({length: N}, () => Array(N).fill(0));
    if (solveBacktrack(grid, 0, 0, clues)) {
        for(let r=0; r<N; r++) for(let c=0; c<N; c++) {
            const el = document.getElementById(`cell-${r}-${c}`);
            el.innerText = grid[r][c]; el.style.color = 'var(--primary)';
        }
        validateBoard();
    } else alert("无解！");
}
function solveBacktrack(grid, r, c, clues) {
    if (r === N) return true;
    let nR = (c === N-1) ? r + 1 : r, nC = (c === N-1) ? 0 : c + 1;
    for (let v = 1; v <= N; v++) {
        if (isSafe(grid, r, c, v, clues)) {
            grid[r][c] = v;
            if (solveBacktrack(grid, nR, nC, clues)) return true;
            grid[r][c] = 0;
        }
    }
    return false;
}
function isSafe(grid, r, c, v, clues) {
    for (let i = 0; i < N; i++) if (grid[r][i] === v || grid[i][c] === v) return false;
    grid[r][c] = v; let ok = true;
    if (c === N - 1) {
        if (clues.left[r] && countVisible(grid[r]) !== clues.left[r]) ok = false;
        if (clues.right[r] && countVisible([...grid[r]].reverse()) !== clues.right[r]) ok = false;
    }
    if (ok && r === N - 1) {
        let col = []; for(let i=0; i<N; i++) col.push(grid[i][c]);
        if (clues.top[c] && countVisible(col) !== clues.top[c]) ok = false;
        if (clues.bottom[c] && countVisible([...col].reverse()) !== clues.bottom[c]) ok = false;
    }
    grid[r][c] = 0; return ok;
}
function generatePuzzle() {
    initBoard();
    let grid = Array.from({length: N}, () => Array(N).fill(0));
    for(let r=0; r<N; r++) for(let c=0; c<N; c++) grid[r][c] = (r + c) % N + 1;
    grid.sort(() => Math.random() - 0.5);
    for(let i=0; i<N; i++) {
        document.getElementById(`clue-left-${i}`).innerText = countVisible(grid[i]);
        document.getElementById(`clue-right-${i}`).innerText = countVisible([...grid[i]].reverse());
        let col = []; for(let j=0; j<N; j++) col.push(grid[j][i]);
        document.getElementById(`clue-top-${i}`).innerText = countVisible(col);
        document.getElementById(`clue-bottom-${i}`).innerText = countVisible([...col].reverse());
    }
    validateBoard();
}
function resetBoard() { document.querySelectorAll('.cell').forEach(el => { el.innerText = ''; }); validateBoard(); }
initBoard();
</script>
</body>
</html>
