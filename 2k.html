<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>楼宇逻辑解谜</title>
    <style>
        :root { --primary: #6c5ce7; --bg: #f8f9fd; --success: #00b894; --error: #ff7675; }
        body { 
            font-family: 'PingFang SC', system-ui; background: var(--bg); 
            margin: 0; padding: 20px; color: #2d3436;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .side-panel {
            position: fixed; top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 12px;
            background: white; padding: 20px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); z-index: 1000;
        }

        .panel-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: bold; font-size: 0.9em; }
        #sizeInput { width: 40px; border: 1px solid #ddd; border-radius: 4px; padding: 4px; text-align: center; }

        button { 
            padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; 
            font-weight: bold; transition: 0.2s; font-size: 0.85em;
        }
        .btn-mode { border: 2px solid var(--primary); background: white; color: var(--primary); }
        .btn-mode.active { background: var(--primary); color: white; }
        .btn-action { background: #eeefff; color: var(--primary); }
        .btn-action:hover { background: var(--primary); color: white; }

        .main-content { display: flex; flex-direction: column; align-items: center; padding: 100px; }

        .puzzle-wrapper { 
            display: inline-grid; gap: 12px; padding: 15px; 
            background: #f1f2f6; border-radius: 20px; position: relative;
        }
        
        .item-container { position: relative; width: 50px; height: 50px; }

        /* 格子和线索基础样式 */
        .cell, .clue-main { 
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; 
            border-radius: 8px; cursor: pointer; background: white; border: 1px solid #dcdde1; 
            font-weight: bold; font-size: 1.5em; user-select: none; transition: 0.2s;
        }

        /* 线索圆圈样式 */
        .clue-main { border: 2px solid var(--primary); color: var(--primary); border-radius: 50%; font-size: 1.1em; z-index: 5; }
        .clue-main.valid { background: var(--success); border-color: var(--success); color: white; }
        .clue-main.invalid { background: var(--error); border-color: var(--error); color: white; }

        /* 修改模式下的格子表现 */
        .edit-mode .cell { opacity: 0.4; cursor: not-allowed; }
        .cell.conflict { color: var(--error); background: #fff5f5; border-color: var(--error); }
        .cell.solved-num { color: var(--primary); }

        /* 线索选项条 */
        .options-bar { position: absolute; display: none; gap: 5px; z-index: 10; }
        .edit-mode .options-bar { display: flex; }
        
        .bar-top { bottom: 120%; left: 50%; transform: translateX(-50%); flex-direction: column-reverse; }
        .bar-bottom { top: 120%; left: 50%; transform: translateX(-50%); flex-direction: column; }
        .bar-left { right: 120%; top: 50%; transform: translateY(-50%); flex-direction: row-reverse; }
        .bar-right { left: 120%; top: 50%; transform: translateY(-50%); flex-direction: row; }

        .opt-btn {
            width: 28px; height: 28px; background: #dfe6e9; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; font-size: 0.8em;
            color: #2d3436; transition: 0.1s;
        }
        .opt-btn:hover { background: var(--primary); color: white; }
        .opt-btn.active { background: var(--primary); color: white; }
        .opt-btn.x { background: #fab1a0; color: #d63031; }

        /* 中间格子的数字选择器 */
        .cell-picker {
            position: absolute; display: none; grid-template-columns: repeat(3, 1fr);
            gap: 4px; background: #2d3436; padding: 6px; border-radius: 8px;
            top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .cell-picker .opt-btn { background: #444; color: white; border: none; }
        .cell-picker .opt-btn:hover { background: var(--primary); }
    </style>
</head>
<body>

<div class="side-panel">
    <div class="panel-item">
        <span>边长:</span>
        <input type="number" id="sizeInput" value="4" min="3" max="6" onchange="initBoard()">
    </div>
    <button class="btn-mode" id="editToggle" onclick="toggleEditMode()">🛠️ 修改边值模式</button>
    <hr style="width:100%; border:0; border-top:1px solid #eee;">
    <button class="btn-action" onclick="generatePuzzle()">随机出题</button>
    <button class="btn-action" onclick="solvePuzzle()">一键求解</button>
    <button class="btn-action" style="color:#e74c3c" onclick="resetBoard()">重置格子</button>
</div>

<div class="main-content">
    <div id="puzzleBoard" class="puzzle-wrapper"></div>
</div>

<script>
let N = 4;
let isEditMode = false;

function toggleEditMode() {
    isEditMode = !isEditMode;
    const btn = document.getElementById('editToggle');
    const board = document.getElementById('puzzleBoard');
    btn.classList.toggle('active', isEditMode);
    board.classList.toggle('edit-mode', isEditMode);
    // 切换模式时关闭所有打开的格子菜单
    hideAllPickers();
}

function initBoard() {
    N = parseInt(document.getElementById('sizeInput').value);
    const board = document.getElementById('puzzleBoard');
    board.style.gridTemplateColumns = `repeat(${N + 2}, 50px)`;
    board.innerHTML = '';

    for (let r = 0; r < N + 2; r++) {
        for (let c = 0; c < N + 2; c++) {
            const container = document.createElement('div');
            container.className = 'item-container';
            const isCorner = (r === 0 || r === N + 1) && (c === 0 || c === N + 1);
            const isClue = r === 0 || r === N + 1 || c === 0 || c === N + 1;

            if (isCorner) {
                board.appendChild(container);
                continue;
            }

            if (isClue) {
                // 边值逻辑
                const type = r === 0 ? 'top' : r === N + 1 ? 'bottom' : c === 0 ? 'left' : 'right';
                const idx = (type === 'top' || type === 'bottom') ? c - 1 : r - 1;
                const clueMain = document.createElement('div');
                clueMain.className = 'clue-main';
                clueMain.id = `clue-${type}-${idx}`;
                
                const bar = document.createElement('div');
                bar.className = `options-bar bar-${type}`;
                for (let i = 1; i <= N; i++) {
                    const opt = document.createElement('div');
                    opt.className = 'opt-btn'; opt.innerText = i;
                    opt.onclick = (e) => {
                        e.stopPropagation();
                        clueMain.innerText = i;
                        bar.querySelectorAll('.opt-btn').forEach(b => b.classList.toggle('active', b.innerText == i));
                        validateBoard();
                    };
                    bar.appendChild(opt);
                }
                const clear = document.createElement('div');
                clear.className = 'opt-btn x'; clear.innerText = 'X';
                clear.onclick = (e) => {
                    e.stopPropagation();
                    clueMain.innerText = '';
                    bar.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                    validateBoard();
                };
                bar.appendChild(clear);
                container.appendChild(clueMain);
                container.appendChild(bar);
            } else {
                // 格子逻辑
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r-1}-${c-1}`;
                
                const picker = document.createElement('div');
                picker.className = 'cell-picker';
                for(let i=1; i<=N; i++) {
                    const b = document.createElement('div');
                    b.className = 'opt-btn'; b.innerText = i;
                    b.onclick = (e) => {
                        e.stopPropagation();
                        cell.innerText = i;
                        cell.classList.remove('solved-num');
                        picker.style.display='none'; 
                        validateBoard();
                    };
                    picker.appendChild(b);
                }
                const x = document.createElement('div');
                x.className = 'opt-btn x'; x.innerText = 'X';
                x.onclick = (e) => { e.stopPropagation(); cell.innerText = ''; picker.style.display='none'; validateBoard(); };
                picker.appendChild(x);

                cell.onclick = (e) => {
                    if (isEditMode) return; // 编辑模式下格子不可点
                    e.stopPropagation();
                    const alreadyOpen = picker.style.display === 'grid';
                    hideAllPickers();
                    if (!alreadyOpen) picker.style.display = 'grid';
                };
                container.appendChild(cell);
                container.appendChild(picker);
            }
            board.appendChild(container);
        }
    }
}

function hideAllPickers() {
    document.querySelectorAll('.cell-picker').forEach(p => p.style.display = 'none');
}

// 核心计算逻辑
function countVisible(arr) {
    let count = 0, max = 0;
    for (let val of arr) { if (val > max) { count++; max = val; } }
    return count;
}

function getGridState() {
    let grid = [];
    for (let r = 0; r < N; r++) {
        grid[r] = [];
        for (let c = 0; c < N; c++) grid[r][c] = parseInt(document.getElementById(`cell-${r}-${c}`).innerText) || 0;
    }
    return grid;
}

function getCluesState() {
    const clues = { top:[], bottom:[], left:[], right:[] };
    for(let i=0; i<N; i++) {
        clues.top.push(parseInt(document.getElementById(`clue-top-${i}`).innerText) || 0);
        clues.bottom.push(parseInt(document.getElementById(`clue-bottom-${i}`).innerText) || 0);
        clues.left.push(parseInt(document.getElementById(`clue-left-${i}`).innerText) || 0);
        clues.right.push(parseInt(document.getElementById(`clue-right-${i}`).innerText) || 0);
    }
    return clues;
}

function validateBoard() {
    const grid = getGridState();
    const clues = getCluesState();
    document.querySelectorAll('.cell').forEach(el => el.classList.remove('conflict'));
    document.querySelectorAll('.clue-main').forEach(el => el.classList.remove('valid', 'invalid'));

    for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
            const val = grid[r][c];
            if (!val) continue;
            for (let i = 0; i < N; i++) {
                if ((i !== c && grid[r][i] === val) || (i !== r && grid[i][c] === val)) {
                    document.getElementById(`cell-${r}-${c}`).classList.add('conflict');
                }
            }
        }
    }

    for (let i = 0; i < N; i++) {
        checkLine(grid[i], `clue-left-${i}`, clues.left[i]);
        checkLine([...grid[i]].reverse(), `clue-right-${i}`, clues.right[i]);
        let col = []; for (let r = 0; r < N; r++) col.push(grid[r][i]);
        checkLine(col, `clue-top-${i}`, clues.top[i]);
        checkLine([...col].reverse(), `clue-bottom-${i}`, clues.bottom[i]);
    }
}

function checkLine(arr, id, target) {
    if (!target) return;
    const el = document.getElementById(id);
    const vis = countVisible(arr);
    if (!arr.includes(0)) el.classList.add(vis === target ? 'valid' : 'invalid');
    else if (vis > target) el.classList.add('invalid');
}

function solvePuzzle() {
    const clues = getCluesState();
    let grid = Array.from({length: N}, () => Array(N).fill(0));
    if (solveBacktrack(grid, 0, 0, clues)) {
        for(let r=0; r<N; r++) for(let c=0; c<N; c++) {
            const el = document.getElementById(`cell-${r}-${c}`);
            el.innerText = grid[r][c];
            el.classList.add('solved-num');
        }
        validateBoard();
    } else alert("根据当前线索无法求解！");
}

function solveBacktrack(grid, r, c, clues) {
    if (r === N) return true;
    let nR = (c === N-1) ? r + 1 : r, nC = (c === N-1) ? 0 : c + 1;
    for (let v = 1; v <= N; v++) {
        if (isSafe(grid, r, c, v, clues)) {
            grid[r][c] = v;
            if (solveBacktrack(grid, nR, nC, clues)) return true;
            grid[r][c] = 0;
        }
    }
    return false;
}

function isSafe(grid, r, c, v, clues) {
    for (let i = 0; i < N; i++) if (grid[r][i] === v || grid[i][c] === v) return false;
    grid[r][c] = v;
    let ok = true;
    if (c === N - 1) {
        if (clues.left[r] && countVisible(grid[r]) !== clues.left[r]) ok = false;
        if (clues.right[r] && countVisible([...grid[r]].reverse()) !== clues.right[r]) ok = false;
    }
    if (ok && r === N - 1) {
        let col = []; for(let i=0; i<N; i++) col.push(grid[i][c]);
        if (clues.top[c] && countVisible(col) !== clues.top[c]) ok = false;
        if (clues.bottom[c] && countVisible([...col].reverse()) !== clues.bottom[c]) ok = false;
    }
    grid[r][c] = 0; return ok;
}

function generatePuzzle() {
    initBoard();
    let grid = Array.from({length: N}, () => Array(N).fill(0));
    for(let r=0; r<N; r++) for(let c=0; c<N; c++) grid[r][c] = (r + c) % N + 1;
    grid.sort(() => Math.random() - 0.5);
    for(let i=0; i<N; i++) {
        document.getElementById(`clue-left-${i}`).innerText = countVisible(grid[i]);
        document.getElementById(`clue-right-${i}`).innerText = countVisible([...grid[i]].reverse());
        let col = []; for(let j=0; j<N; j++) col.push(grid[j][i]);
        document.getElementById(`clue-top-${i}`).innerText = countVisible(col);
        document.getElementById(`clue-bottom-${i}`).innerText = countVisible([...col].reverse());
    }
    validateBoard();
}

function resetBoard() {
    document.querySelectorAll('.cell').forEach(el => { 
        el.innerText = ''; 
        el.classList.remove('solved-num');
    });
    validateBoard();
}

document.addEventListener('click', hideAllPickers);
initBoard();
</script>
</body>
</html>
